# Pings the Supabase REST API daily so the free-tier project never hits the
# 7-day inactivity pause. workflow_dispatch also re-arms the schedule, which
# GitHub disables after 60 days without commits.
name: keepalive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query app_settings
        run: |
          curl -sSf \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
