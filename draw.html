<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0A0F1A" />
  <title>تحدي الرسم · Sketch Challenge</title>
  <style>
    /* Standalone styles — must NOT depend on the React app's CSS.
       Palette mirrors public/c.html so the two phone pages feel related. */
    :root {
      /* This page ships its own dark chrome — tell the browser so it does not
         force-dark (which would invert the white drawing canvas). */
      color-scheme: dark;
      --ink: #0A0F1A;
      --ink-80: #11182a;
      --cream: #F4ECD8;
      --cream-60: rgba(244, 236, 216, 0.6);
      --cream-45: rgba(244, 236, 216, 0.45);
      --gold: #D4A24C;
      --gold-light: #E6BE74;
      --gold-40: rgba(212, 162, 76, 0.4);
      --gold-15: rgba(212, 162, 76, 0.15);
      --teal: #1A7A6E;
      --teal-bg: rgba(26, 122, 110, 0.18);
      --teal-border: rgba(26, 122, 110, 0.55);
      --crimson: #C44150;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--ink);
      color: var(--cream);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma,
                   "Noto Sans Arabic", "Arabic UI Display", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .tag {
      align-self: center;
      margin-top: 1rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      background: var(--teal-bg);
      border: 1px solid var(--teal-border);
      color: var(--teal);
      border-radius: 9999px;
      flex-shrink: 0;
    }

    /* ─── Reveal section (word + Ready) ─────────────────────────── */
    .reveal {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity 250ms ease 100ms;
    }
    .reveal.revealed { opacity: 1; }
    .reveal-label {
      font-size: 0.95rem;
      color: var(--cream-60);
    }
    .reveal-label .en { font-style: italic; opacity: 0.8; direction: ltr; }
    .word-primary {
      font-size: clamp(2.25rem, 10vw, 4rem);
      line-height: 1.35;
      font-weight: 700;
      margin: 0;
      padding: 0 0.5rem;
      text-wrap: balance;
    }
    .word-secondary {
      font-size: clamp(1rem, 4.5vw, 1.6rem);
      line-height: 1.4;
      color: var(--cream-60);
      font-style: italic;
      margin: 0;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .ready {
      margin-top: 0.5rem;
      padding: 0.95rem 1.75rem;
      min-height: 56px;
      background: var(--gold);
      color: var(--ink);
      border: none;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 120ms ease, filter 120ms ease;
    }
    .ready:active { transform: scale(0.97); filter: brightness(0.92); }
    .ready-sub {
      font-size: 0.8rem;
      color: var(--cream-45);
      margin: 0;
    }
    .ready-sub .en { font-style: italic; direction: ltr; }

    /* ─── Draw section (canvas + toolbar) ───────────────────────── */
    .draw {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      padding: 0.5rem 0.75rem 0.75rem;
    }
    .draw.active { display: flex; }
    .draw-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.25rem 0.6rem;
      flex-shrink: 0;
    }
    .cat-hint {
      font-size: 0.8rem;
      color: var(--cream-45);
    }
    .cat-hint .en { font-style: italic; direction: ltr; }
    .timer {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--gold-light);
      min-width: 2.5ch;
      text-align: end;
    }
    .timer.urgent { color: var(--crimson); }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    /* The box's 3:4 size is set in JS by sizeCanvas() — a CSS aspect-ratio
       box whose only children are absolutely positioned has no in-flow
       content to size from and collapses to 0×0, so the dimensions must be
       computed from the wrap instead. */
    .canvas-box {
      position: relative;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .canvas-box canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    .toolbar {
      direction: ltr; /* fixed Undo | Clear | Done order regardless of page dir */
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
      flex-shrink: 0;
    }
    .tool {
      flex: 1;
      min-height: 56px;
      padding: 0.5rem;
      background: var(--ink-80);
      color: var(--cream);
      border: 1.5px solid var(--gold-40);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      transition: background 120ms ease, transform 120ms ease;
    }
    .tool:active { transform: scale(0.96); }
    .tool .sub { font-size: 0.65rem; opacity: 0.6; font-style: italic; }
    .tool.primary {
      flex: 1.35;
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
    }
    .tool.primary .sub { opacity: 0.75; }
    .tool:disabled { opacity: 0.4; cursor: default; }

    /* ─── Pen-colour palette ────────────────────────────────────── */
    .palette {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
      flex-shrink: 0;
    }
    .swatch {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(244, 236, 216, 0.3);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .swatch:active { transform: scale(0.9); }
    .swatch.selected {
      border-color: var(--gold);
      transform: scale(1.14);
      box-shadow: 0 0 0 2px var(--ink), 0 0 10px var(--gold-40);
    }

    /* Toast (Clear feedback) */
    .toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--cream);
      border: 1px solid var(--gold-40);
      border-radius: 9999px;
      padding: 0.3rem 0.9rem;
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
      z-index: 5;
    }
    .toast.show { opacity: 1; }

    /* Round overlays over the canvas — waiting-to-start and round-over */
    .done-overlay,
    .wait-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: rgba(10, 15, 26, 0.92);
      color: var(--cream);
      text-align: center;
      padding: 1rem;
      z-index: 6;
    }
    .done-overlay.show,
    .wait-overlay.show { display: flex; }
    .done-overlay .big,
    .wait-overlay .big { font-size: 1.5rem; font-weight: 700; color: var(--gold-light); }
    .done-overlay .small,
    .wait-overlay .small { font-size: 0.9rem; color: var(--cream-60); font-style: italic; direction: ltr; }

    /* ─── Post-lock countdown ───────────────────────────────────── */
    .countdown {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      min-height: 1.4em; /* stable height before first tick */
    }
    .countdown-label {
      font-size: 0.8rem;
      color: var(--cream-60);
      font-style: italic;
    }
    .countdown-label .en { direction: ltr; }
    /* Dim palette + toolbar once the round ends — phone is fully dead */
    body.locked .palette,
    body.locked .toolbar { opacity: 0.45; pointer-events: none; }

    /* ─── Anti-spoiler gate ─────────────────────────────────────── */
    .gate {
      position: fixed;
      inset: 0;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: opacity 150ms ease;
      z-index: 10;
    }
    .gate.gone { opacity: 0; pointer-events: none; }
    .gate-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
    }
    .gate-ar { font-size: clamp(1.5rem, 6vw, 2rem); color: var(--gold); }
    .gate-en {
      font-size: clamp(0.875rem, 3vw, 1rem);
      color: var(--cream-60);
      font-weight: 400;
      font-style: italic;
      direction: ltr;
    }

    .err {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      color: var(--crimson);
      font-size: 1rem;
      text-align: center;
      padding: 2rem;
    }
    .err.show { display: flex; }
  </style>
</head>
<body>
  <span class="tag">تحدي الرسم · Sketch Challenge</span>

  <!-- Word reveal -->
  <section class="reveal" id="reveal">
    <p class="reveal-label">
      ارسم هذه الكلمة <span class="en">· Draw this word</span>
    </p>
    <h1 class="word-primary" id="word-primary">—</h1>
    <p class="word-secondary" id="word-secondary"></p>
    <button class="ready" id="ready" type="button">جاهز — ابدأ الرسم</button>
    <p class="ready-sub">
      رأيتُها <span class="en">· I've seen it — start the canvas</span>
    </p>
  </section>

  <!-- Drawing canvas -->
  <section class="draw" id="draw">
    <div class="draw-header">
      <span class="cat-hint" id="cat-hint"></span>
      <span class="timer" id="timer"></span>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="canvas-box" id="canvas-box">
        <canvas id="canvas"></canvas>
        <div class="toast" id="toast"></div>
        <div class="wait-overlay" id="wait-overlay">
          <span class="big">استعدّ…</span>
          <span class="small">Waiting for both teams — draw when the timer starts</span>
        </div>
        <div class="done-overlay" id="done-overlay">
          <span class="big">انتهت الجولة</span>
          <span class="small">Round over — watch the big screen</span>
          <span class="countdown" id="countdown" aria-live="polite"></span>
          <span class="countdown-label" id="countdown-label">إغلاق خلال… <span class="en">· Closing in…</span></span>
        </div>
      </div>
    </div>
    <div class="palette" id="palette" role="group" aria-label="لون القلم · Pen colour"></div>
    <div class="toolbar">
      <button class="tool" id="undo" type="button">
        <span>↩ تراجع</span><span class="sub">Undo</span>
      </button>
      <button class="tool" id="clear" type="button">
        <span>✕ مسح</span><span class="sub">Clear</span>
      </button>
      <button class="tool primary" id="done" type="button">
        <span>✓ انتهيت</span><span class="sub">Done</span>
      </button>
    </div>
  </section>

  <!-- Invalid-link fallback -->
  <div class="err" id="err">
    رابط غير صالح<br />
    <span style="font-style:italic;opacity:0.7">Invalid link</span>
  </div>

  <!-- Anti-spoiler gate -->
  <div class="gate" id="gate" role="button" tabindex="0" aria-label="Tap to reveal">
    <div class="gate-inner">
      <span class="gate-ar">اضغط للكشف</span>
      <span class="gate-en">Tap to reveal</span>
    </div>
  </div>

  <script type="module" src="/src/draw/main.js"></script>
</body>
</html>
